name: Deploy

on:
    push:
        branches:
            - main
            - production

concurrency:
    group: deployment
    cancel-in-progress: true

env:
    WASP_VERSION: '0.23.0'
    REACT_APP_PUBLIC_POSTHOG_KEY: 'phc_ESNFwNfsPoutTD93jgJM11bA7JSfRNqJPHjEY2wyN62'
    REACT_APP_PUBLIC_POSTHOG_HOST: 'https://eu.i.posthog.com'

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set environment config
              run: |
                  if [ "${{ github.ref_name }}" = "production" ]; then
                    echo "SHELVE_ENV=production"               >> $GITHUB_ENV
                    echo "RAILWAY_PROJECT_NAME=personalbeats-production" >> $GITHUB_ENV
                    echo "RAILWAY_PROJECT_ID=f873c494-8815-4b75-8f2c-17d8ef217faf"       >> $GITHUB_ENV
                    echo "RAILWAY_ENV_ID=942665b8-f13e-4e47-9f0e-36c6e3a68c2e"           >> $GITHUB_ENV
                    echo "RAILWAY_SERVICE_ID_SERVER=194c7846-d71c-4746-8972-9f97c9025e95" >> $GITHUB_ENV
                    echo "RAILWAY_SERVICE_ID_CLIENT=59a7b27a-9b98-4f6c-99fa-9e4b54da661c" >> $GITHUB_ENV
                  else
                    echo "SHELVE_ENV=staging"                  >> $GITHUB_ENV
                    echo "RAILWAY_PROJECT_NAME=personalbeats-staging" >> $GITHUB_ENV
                    echo "RAILWAY_PROJECT_ID=776dfc38-c9b9-4cff-9649-72b6e48e0014"       >> $GITHUB_ENV
                    echo "RAILWAY_ENV_ID=8cf98e60-7d33-4f76-ac59-2e3566152f68"           >> $GITHUB_ENV
                    echo "RAILWAY_SERVICE_ID_SERVER=4f29f801-0339-4a6f-bfee-91275119cd2b" >> $GITHUB_ENV
                    echo "RAILWAY_SERVICE_ID_CLIENT=accc31f0-1dd2-46ed-b908-abdc10f62718" >> $GITHUB_ENV
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install Shelve CLI
              run: npm install -g @shelve/cli@4.2.0

            - name: Pull variables from Shelve
              env:
                  SHELVE_TOKEN: ${{ secrets.SHELVE_TOKEN }}
              run: |
                  node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('shelve.json','utf8'));c.envFileName='.env.server';fs.writeFileSync('shelve.json',JSON.stringify(c,null,2))"
                  shelve pull --env ${{ env.SHELVE_ENV }}-server
                  test -f .env.server || { echo "Expected .env.server from shelve pull"; exit 1; }

                  node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('shelve.json','utf8'));c.envFileName='.env.client';fs.writeFileSync('shelve.json',JSON.stringify(c,null,2))"
                  shelve pull --env ${{ env.SHELVE_ENV }}-client
                  touch .env.client

            - name: Sync variables to Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
              run: |
                  node - <<'EOF'
                  const fs = require('fs');

                  function parseEnv(file) {
                    const vars = {};
                    for (const line of fs.readFileSync(file, 'utf8').split('\n')) {
                      const trimmed = line.trim();
                      if (!trimmed || trimmed.startsWith('#')) continue;
                      const eq = trimmed.indexOf('=');
                      if (eq === -1) continue;
                      vars[trimmed.slice(0, eq).trim()] = trimmed.slice(eq + 1).trim();
                    }
                    return vars;
                  }

                  async function upsert(serviceId, variables) {
                    const res = await fetch('https://backboard.railway.com/graphql/v2', {
                      method: 'POST',
                      headers: {
                        'Authorization': `Bearer ${process.env.RAILWAY_TOKEN}`,
                        'Content-Type': 'application/json',
                      },
                      body: JSON.stringify({
                        query: `mutation($input: VariableCollectionUpsertInput!) {
                          variableCollectionUpsert(input: $input)
                        }`,
                        variables: {
                          input: {
                            projectId: process.env.RAILWAY_PROJECT_ID,
                            environmentId: process.env.RAILWAY_ENV_ID,
                            serviceId,
                            variables,
                          },
                        },
                      }),
                    });
                    const json = await res.json();
                    if (json.errors) throw new Error(json.errors[0].message);
                    return json.data.variableCollectionUpsert;
                  }

                  (async () => {
                    const server = parseEnv('.env.server');
                    const client = parseEnv('.env.client');
                    console.log(`Pushing ${Object.keys(server).length} vars to server...`);
                    await upsert(process.env.RAILWAY_SERVICE_ID_SERVER, server);
                    console.log(`Pushing ${Object.keys(client).length} vars to client...`);
                    await upsert(process.env.RAILWAY_SERVICE_ID_CLIENT, client);
                    console.log('Done.');
                  })().catch(e => { console.error(e); process.exit(1); });
                  EOF

            - name: Export client env vars for build
              run: |
                  while IFS= read -r line || [ -n "$line" ]; do
                    [[ -z "$line" || "$line" == \#* ]] && continue
                    echo "$line" >> $GITHUB_ENV
                  done < .env.client

            - name: Install Wasp
              run: npm install -g @wasp.sh/wasp-cli@${{ env.WASP_VERSION }} @wasp.sh/wasp-cli-linux-x64-glibc@${{ env.WASP_VERSION }}

            - name: Install Railway CLI
              run: npm install -g @railway/cli@4.11.1

            - name: Deploy to Railway
              run: |
                  if wasp deploy railway deploy ${{ env.RAILWAY_PROJECT_NAME }} --existing-project-id ${{ env.RAILWAY_PROJECT_ID }}; then
                    echo "Deploy successful"
                  elif [ -f .wasp/out/web-app/build/Caddyfile ]; then
                    echo "Client deploy failed at Railway (Railpack). Adding start.sh and redeploying client..."
                    printf '#!/bin/sh\nexec caddy run --config Caddyfile --adapter caddyfile\n' > .wasp/out/web-app/build/start.sh
                    chmod +x .wasp/out/web-app/build/start.sh
                    railway up .wasp/out/web-app/build \
                      --service "${{ env.RAILWAY_PROJECT_NAME }}-client" \
                      --no-gitignore \
                      --path-as-root \
                      --ci
                  else
                    echo "Deploy failed before client build"
                    exit 1
                  fi
              env:
                  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
