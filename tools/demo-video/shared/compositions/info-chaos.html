    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ns = '[data-composition-id="info-chaos"]';

      // Deterministic PRNG (mulberry32) so every render frame is stable
      function mulberry32(a) {
        return function() {
          a |= 0; a = a + 0x6D2B79F5 | 0;
          let t = a;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(20260426);

      // Peripheral chaos cards — burst in 0..1.8s, then drift outward as the reel grows
      const cardEls = document.querySelectorAll(ns + ' .ic-card');
      const W = 1920, H = 1080;
      const cardDrifts = Array.from(cardEls, (el) => {
        // outward direction = vector from center to card's anchor
        const top = parseFloat(el.style.top) / 100 * H;
        const left = parseFloat(el.style.left) / 100 * W;
        const dx = left + 230 - W / 2;
        const dy = top + 50 - H / 2;
        const len = Math.max(Math.hypot(dx, dy), 1);
        return {
          ux: dx / len, uy: dy / len,
          rot: (rand() - 0.5) * 2.4,
          burstDelay: rand() * 1.4,
        };
      });
      cardEls.forEach((el, i) => {
        tl.to(el, {
          opacity: 1, y: 0, duration: 0.28, ease: "power2.out"
        }, 0.05 + cardDrifts[i].burstDelay);
        // outward drift: ~140px in the radial direction over 4s
        tl.to(el, {
          x: cardDrifts[i].ux * 140, y: cardDrifts[i].uy * 140,
          rotation: cardDrifts[i].rot,
          duration: 4.0, ease: "power1.in"
        }, 1.4);
      });

      // Center reel container — slowly zooms 0.55x → 1.35x while images flash
      tl.to(ns + ' .ic-reel', {
        scale: 1.35,
        duration: 3.4, ease: "power1.inOut",
        transformOrigin: "center center"
      }, 1.2);

      // Center reel — 26 images, ~125ms each, runs 1.4..4.7s (3.3s window)
      const reelEls = document.querySelectorAll(ns + ' .ic-reel-img');
      const REEL_START = 1.4;
      const REEL_STEP = 3.3 / Math.max(reelEls.length, 1);
      reelEls.forEach((el, i) => {
        const at = REEL_START + i * REEL_STEP;
        tl.set(el, { opacity: 0 }, at - 0.001);
        tl.to(el, { opacity: 1, duration: 0.04, ease: "none" }, at);
        tl.to(el, { opacity: 0, duration: 0.04, ease: "none" }, at + REEL_STEP - 0.02);
      });

      // Peripheral cards fade as overload intensifies
      tl.to(ns + ' .ic-card', {
        opacity: 0.35, duration: 1.0, ease: "power2.out"
      }, 1.6);

      // Vignette closes 4.4..5.2s, rest of cards fade
      tl.to(ns + ' .ic-vignette', {
        opacity: 1, duration: 0.7, ease: "power2.out"
      }, 4.4);
      tl.to(ns + ' .ic-card', {
        opacity: 0, duration: 0.5, ease: "power2.in"
      }, 4.6);
      // fade the reel as we transition out
      tl.to(ns + ' .ic-reel', {
        opacity: 0, duration: 0.5, ease: "power2.in"
      }, 4.7);

      // Tagline lands 4.7..5.6s, holds through end of scene (~8s)
      tl.to(ns + ' .ic-tagline', {
        opacity: 1, duration: 0.4, ease: "power2.out"
      }, 4.7);
      tl.from(ns + ' .ic-tag-line-1', {
        y: 12, opacity: 0, duration: 0.4, ease: "power2.out"
      }, 4.8);
      tl.from(ns + ' .ic-tag-line-2', {
        y: 16, opacity: 0, duration: 0.55, ease: "power3.out"
      }, 5.0);
      // Hold tagline visible (deterministic noop tween — keeps it on screen)
      tl.to(ns + ' .ic-tagline', {
        opacity: 1, duration: 0.001
      }, 7.6);

      window.__timelines["info-chaos"] = tl;
    </script>
