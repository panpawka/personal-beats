    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ns = '[data-composition-id="vignette-kasper"]';

      tl.from(ns + ' .vk-folio', { opacity: 0, y: -8, duration: 0.4, ease: "power2.out" }, 0.0);

      // SCENE 1 — persona (0..1.4s)
      tl.to(ns + ' .vk-scene-persona', { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.0);
      tl.from(ns + ' .vk-persona-name', { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.from(ns + ' .vk-persona-meta', { y: 16, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.4);

      // SCENE 2 — composer (1.4..4.5s)
      tl.to(ns + ' .vk-scene-persona', { opacity: 0, duration: 0.25, ease: "power2.in" }, 1.4);
      tl.to(ns + ' .vk-scene-composer', { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.5);
      tl.from(ns + ' .vk-composer', { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, 1.55);
      tl.to(ns + ' .vk-cursor', { opacity: 0, duration: 0.3, repeat: 8, yoyo: true, ease: "none" }, 1.8);
      // Per-char stagger reveal — deterministic in render.
      const briefText = "Iran-Israel situation, daily, with primary sources";
      const typedEl = document.querySelector(ns + ' .vk-typed-1');
      if (typedEl) {
        typedEl.innerHTML = briefText.split("").map(
          (c) => `<span class="vk-ch">${c === " " ? "&nbsp;" : c}</span>`
        ).join("");
      }
      tl.from(ns + ' .vk-typed-1 .vk-ch', {
        autoAlpha: 0, display: "none",
        duration: 0.001, stagger: 2.4 / briefText.length, ease: "none"
      }, 2.0);

      // SCENE 3 — clarification gate (4.5..10.5s)
      tl.to(ns + ' .vk-scene-composer', { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.5);
      tl.to(ns + ' .vk-scene-clarif', { opacity: 1, duration: 0.35, ease: "power2.out" }, 4.6);
      tl.from(ns + ' .vk-turn-user-1', { y: 14, opacity: 0, duration: 0.35, ease: "power2.out" }, 4.75);
      tl.from(ns + ' .vk-turn-editor-1', { y: 14, opacity: 0, duration: 0.4, ease: "expo.out" }, 5.6);
      tl.from(ns + ' .vk-turn-user-2', { y: 14, opacity: 0, duration: 0.35, ease: "power2.out" }, 7.4);
      tl.from(ns + ' .vk-turn-editor-2', { y: 14, opacity: 0, duration: 0.4, ease: "power3.out" }, 8.05);

      // SCENE 4 — email reveal (10.5..11.85s)
      tl.to(ns + ' .vk-scene-clarif', { opacity: 0, duration: 0.25, ease: "power2.in" }, 10.5);
      tl.to(ns + ' .vk-scene-email', { opacity: 1, duration: 0.3, ease: "power2.out" }, 10.6);
      tl.from(ns + ' .vk-email', { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 10.65);
      tl.from(ns + ' .vk-story', { y: 12, opacity: 0, duration: 0.25, stagger: 0.06, ease: "power2.out" }, 11.0);

      // SCENE 5 — caption (11.85..13s) — email stays
      tl.to(ns + ' .vk-scene-hold', { opacity: 1, duration: 0.25, ease: "power2.out" }, 11.85);
      tl.from(ns + ' .vk-caption', { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" }, 11.9);

      window.__timelines["vignette-kasper"] = tl;
    </script>
