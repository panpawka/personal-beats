      // SCENE 2 — composer + brief typing (1.6..5s)

      tl.from(ns + ' .vm-composer', { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, 1.75);
      // Cursor blink
      tl.to(ns + ' .vm-cursor', { opacity: 0, duration: 0.3, repeat: 9, yoyo: true, ease: "none" }, 2.0);
      // Per-char stagger reveal
      const briefText = "kids activities in Wrocław on weekends";
      const typedEl = document.querySelector(ns + ' .vm-typed-1');
      if (typedEl) {
        typedEl.innerHTML = briefText.split("").map(
          (c) => `<span class="vm-ch">${c === " " ? "&nbsp;" : c}</span>`
        ).join("");
      }
      tl.from(ns + ' .vm-typed-1 .vm-ch', {
        autoAlpha: 0, display: "none",
        duration: 0.001, stagger: 2.2 / briefText.length, ease: "none"
      }, 2.2);

      // SCENE 3 — clarifying turns + brief card (5..11s)
      tl.to(ns + ' .vm-scene-composer', { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.0);
      tl.to(ns + ' .vm-scene-brief', { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.1);
      tl.from(ns + ' .vm-turn-user-1', { y: 16, opacity: 0, duration: 0.35, ease: "power2.out" }, 5.25);
      tl.from(ns + ' .vm-turn-editor-1', { y: 16, opacity: 0, duration: 0.4, ease: "expo.out" }, 5.85);
      tl.from(ns + ' .vm-turn-user-2', { y: 16, opacity: 0, duration: 0.35, ease: "power2.out" }, 6.85);
      tl.from(ns + ' .vm-turn-editor-2', { y: 16, opacity: 0, duration: 0.4, ease: "expo.out" }, 7.5);
      tl.from(ns + ' .vm-brief-card', { y: 24, opacity: 0, duration: 0.55, ease: "power3.out" }, 8.4);

      tl.to(ns + ' .vm-scene-brief', { opacity: 0, duration: 0.25, ease: "power2.in" }, 11.0);
      tl.to(ns + ' .vm-scene-email', { opacity: 1, duration: 0.35, ease: "power2.out" }, 11.1);
      tl.from(ns + ' .vm-scene-email .vm-email', { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 11.15);
      tl.from(ns + ' .vm-scene-email .vm-story', { y: 12, opacity: 0, duration: 0.25, stagger: 0.06, ease: "power2.out" }, 11.55);

      // SCENE 5 — caption (12.6..14s) — email stays, caption pops fast
      tl.to(ns + ' .vm-scene-hold', { opacity: 1, duration: 0.25, ease: "power2.out" }, 12.6);
      tl.from(ns + ' .vm-caption', { y: 10, opacity: 0, duration: 0.3, ease: "power2.out" }, 12.65);

      window.__timelines["vignette-maja"] = tl;
